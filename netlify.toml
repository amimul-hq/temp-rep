[build]
  command = "npm ci --include=dev && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"
  # These settings are public identifiers or runtime modes, not passwords or tokens.
  # Keep credential scanning enabled for every other environment variable.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,ADMIN_USERNAME,META_PIXEL_ID,VITE_META_PIXEL_ID"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8889

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**", "public/data/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://connect.facebook.net https://www.facebook.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"


